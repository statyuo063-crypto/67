<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM.LOL | Cyber Panel & Hiddify Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(15, 10, 25, 0.85);
            --primary: #a855f7;
            --primary-glow: #c084fc;
            --accent: #ec4899;
            --text-main: #f3e8ff;
            --text-dim: #94a3b8;
            --border: rgba(168, 85, 247, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }
        
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; }

        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        
        .header {
            text-align: center;
            padding: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary-glow);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--primary);
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }

        .status-item span { color: var(--primary-glow); font-weight: bold; }

        .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .panel-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary-glow);
        }

        .btn-outline:hover { background: rgba(168, 85, 247, 0.2); }

        .toggle-group { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
        
        .switch {
            position: relative; display: inline-block; width: 44px; height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .4s; border-radius: 22px;
        }

        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        #terminal {
            background: #000;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            height: 150px;
            overflow-y: auto;
            color: #34d399;
            margin-top: 20px;
        }

        #qrcode {
            display: flex; justify-content: center; margin: 15px 0; padding: 10px; background: white; border-radius: 8px;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <div class="header">
            <h1>PHANTOM.LOL</h1>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Hiddify Tunneling & Cyber Control Panel</p>
            <div class="status-bar">
                <div class="status-item">STATUS: <span>UNDETECTED</span></div>
                <div class="status-item">PING: <span id="ping">24ms</span></div>
                <div class="status-item">SERVER: <span>SG-ZERO-01</span></div>
            </div>
        </div>

        <div class="panel-grid">
            <!-- Hiddify Integration Card -->
            <div class="card">
                <h2>⚡ HIDDIFY CONNECTIVITY</h2>
                <button class="btn" onclick="importHiddify()">🚀 One-Click Import to Hiddify</button>
                <button class="btn btn-outline" onclick="copyConfig()">📋 Copy VLESS / SS Config</button>
                <button class="btn btn-outline" onclick="toggleQR()">📱 Show / Hide QR Code</button>
                
                <div id="qr-container" style="display: none;">
                    <div id="qrcode"></div>
                </div>
            </div>

            <!-- Features & Toggles -->
            <div class="card">
                <h2>🛡️ SYSTEM MODULES</h2>
                <div class="toggle-group">
                    <span>Bypass DPI / Firewall</span>
                    <label class="switch">
                        <input type="checkbox" checked onchange="toggleModule('Bypass DPI', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-group">
                    <span>UDP Fast Forward</span>
                    <label class="switch">
                        <input type="checkbox" checked onchange="toggleModule('UDP Fast', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-group">
                    <span>Phantom Anti-Ban Layer</span>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleModule('Anti-Ban', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Terminal Log -->
        <div id="terminal">
            <div>[SYSTEM] Phantom Engine v2.4 initialized...</div>
            <div>[HIDDIFY] Configuration payload ready.</div>
        </div>
    </div>

    <script>
        // Fake Config Data
        const sampleConfig = "vless://phantom-hiddify-node-sg@104.28.1.1:443?security=reality&type=grpc&sni=gateway.phantom.lol#PHANTOM-SG-ZERO";

        // Sound Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 600, duration = 0.08) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        // Functions
        function log(msg) {
            const term = document.getElementById('terminal');
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            term.appendChild(entry);
            term.scrollTop = term.scrollHeight;
        }

        function importHiddify() {
            playBeep(800);
            log("Importing configuration into Hiddify App...");
            window.location.href = `hiddify://import/${encodeURIComponent(sampleConfig)}`;
        }

        function copyConfig() {
            playBeep(700);
            navigator.clipboard.writeText(sampleConfig);
            log("VLESS Config copied to clipboard successfully!");
            alert("คัดลอก Config เรียบร้อยแล้ว! นำไปวางในแอป Hiddify ได้ทันที");
        }

        let qrGenerated = false;
        function toggleQR() {
            playBeep(500);
            const container = document.getElementById('qr-container');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                if (!qrGenerated) {
                    new QRCode(document.getElementById("qrcode"), {
                        text: sampleConfig,
                        width: 128,
                        height: 128
                    });
                    qrGenerated = true;
                }
                log("QR Code generated for Mobile Scan.");
            } else {
                container.style.display = 'none';
            }
        }

        function toggleModule(name, state) {
            playBeep(state ? 900 : 400);
            log(`Module [${name}] set to: ${state ? 'ENABLED' : 'DISABLED'}`);
        }

        // Background Canvas Matrix Effect
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01PHANTOM';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#a855f7';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
